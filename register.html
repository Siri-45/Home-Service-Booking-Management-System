<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            margin:0;
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:'Segoe UI',sans-serif;

            background:
            linear-gradient(135deg,#0f172a,#1e3a8a);

            padding:40px 0;

        }

        .register-box{

            width:550px;

            background:white;

            padding:35px;

            border-radius:18px;

            box-shadow:
            0 10px 30px rgba(0,0,0,0.2);

        }

        .title{

            text-align:center;

            margin-bottom:25px;

            font-weight:700;

            color:#0f172a;

        }

        .form-control{

            padding:12px;

            border-radius:10px;

            margin-bottom:15px;

        }

        .role-section{

            margin-bottom:20px;

        }

        .role-title{

            font-weight:600;

            margin-bottom:10px;

            color:#334155;

        }

        .role-options{

            display:grid;

            grid-template-columns:
            repeat(3,1fr);

            gap:15px;

        }

        .role-card{

            border:2px solid #cbd5e1;

            border-radius:12px;

            padding:15px;

            text-align:center;

            cursor:pointer;

            transition:0.3s;

            background:#f8fafc;

        }

        .role-card:hover{

            border-color:#2563eb;

            transform:translateY(-3px);

            background:#eff6ff;

        }

        .role-card input{

            display:none;

        }

        .selected{

            border-color:#2563eb;

            background:#dbeafe;

        }

        .btn-register{

            width:100%;

            padding:12px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-weight:600;

            margin-top:10px;

        }

        .btn-register:hover{

            background:#1d4ed8;

        }

        .bottom-link{

            text-align:center;

            margin-top:18px;

        }

        #providerFields{

            display:none;

        }

        /* SERVICE DROPDOWN */

        .service-box{

            margin-bottom:15px;

        }

        .service-label{

            display:block;

            font-weight:600;

            margin-bottom:8px;

            color:#334155;

        }

        .service-select{

            width:100%;

            padding:12px;

            border:2px solid #cbd5e1;

            border-radius:12px;

            background:#f8fafc;

            font-size:15px;

            min-height:120px;

            transition:0.3s;

        }

        .service-select:focus{

            outline:none;

            border-color:#2563eb;

            background:white;

            box-shadow:
            0 0 0 4px rgba(37,99,235,0.15);

        }

        .service-select option{

            padding:10px;

            margin:4px 0;

        }

        .service-note{

            display:block;

            margin-top:6px;

            color:#64748b;

            font-size:12px;

        }

    </style>

</head>

<body>

<div class="register-box">

    <h2 class="title">

        Create Account

    </h2>

    <form method="POST">

        <!-- ROLE SECTION -->

        <div class="role-section">

            <div class="role-title">

                Select Role

            </div>

            <div class="role-options">

                <!-- USER -->

                <label class="role-card"
                       onclick="selectRole(this,'user')">

                    <input type="radio"
                           name="role"
                           value="user"
                           required>

                    <div>User</div>

                </label>

                <!-- PROVIDER -->

                <label class="role-card"
                       onclick="selectRole(this,'provider')">

                    <input type="radio"
                           name="role"
                           value="provider">

                    <div>Provider</div>

                </label>

                <!-- ADMIN -->

                <label class="role-card"
                       onclick="selectRole(this,'admin')">

                    <input type="radio"
                           name="role"
                           value="admin">

                    <div>Admin</div>

                </label>

            </div>

        </div>

        <!-- COMMON FIELDS -->

        <input type="text"
               name="name"
               placeholder="Enter Name"
               class="form-control"
               required>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               class="form-control"
               required>

        <input type="text"
               name="phone"
               placeholder="Enter Phone"
               class="form-control"
               required>

        <input type="text"
               name="address"
               placeholder="Enter Address"
               class="form-control">

        <!-- PROVIDER FIELDS -->

        <div id="providerFields">


            <input type="number"
                   name="experience"
                   placeholder="Experience (Years)"
                   class="form-control">

            <!-- SERVICE SELECT -->

            <div class="service-box">

                <label class="service-label">

                    Select Services

                </label>

                <select name="service_ids"
                        class="service-select"
                        multiple>

                    <option value="1">Electrician</option>
                    <option value="2">Plumber</option>
                    <option value="3">Cleaner</option>

                </select>

                <small class="service-note">

                    Hold Ctrl (Windows) or Command (Mac)
                    to select multiple services

                </small>

            </div>

        </div>

        <!-- PASSWORD -->

        <input type="password"
               name="password"
               placeholder="Enter Password"
               class="form-control"
               required>

        <!-- BUTTON -->

        <button type="submit"
                class="btn-register">

            Register

        </button>

    </form>

    <div class="bottom-link">

        <a href="/">

            Already have an account? Login

        </a>

    </div>

</div>

<script>

function selectRole(element,role){

    let cards =
    document.querySelectorAll('.role-card');

    cards.forEach(card => {

        card.classList.remove('selected');

    });

    element.classList.add('selected');

    // SHOW PROVIDER FIELDS

    if(role === 'provider'){

        document.getElementById(
            'providerFields'
        ).style.display = 'block';

    }

    else{

        document.getElementById(
            'providerFields'
        ).style.display = 'none';

    }

}

</script>

</body>
</html>
