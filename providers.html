<!DOCTYPE html>
<html>
<head>

    <title>Providers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f1f5f9;
            font-family:'Segoe UI',sans-serif;
        }

        .container{
            margin-top:40px;
        }

        .table-box{

            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);

        }

        h2{
            margin-bottom:25px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="table-box">

        <h2>Service Providers</h2>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Experience</th>
                    <th>Service</th>

                </tr>

            </thead>

            <tbody>

                {% for p in providers %}

                <tr>

                    <td>{{p[0]}}</td>
                    <td>{{p[1]}}</td>
                    <td>{{p[2]}}</td>
                    <td>{{p[3]}}</td>
                    <td>{{p[4]}} Years</td>
                    <td>{{ p[5] }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

        <a href="/admin" class="btn btn-primary">
            Back
        </a>

    </div>

</div>

</body>
</html>
