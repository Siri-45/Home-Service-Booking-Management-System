<!DOCTYPE html>
<html>
<head>

    <title>Reschedule Booking</title>

    <style>

        body{
            margin:0;
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#eef2f7,#dbe6f6);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{

            width:450px;
            background:white;
            padding:35px;
            border-radius:16px;
            box-shadow:0 8px 20px rgba(0,0,0,0.1);

        }

        h2{

            text-align:center;
            color:#1e293b;
            margin-bottom:25px;

        }

        label{

            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#334155;

        }

        input,
        select{

            width:100%;
            padding:12px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            margin-bottom:18px;
            font-size:14px;
            box-sizing:border-box;

        }

        input:focus,
        select:focus{

            outline:none;
            border-color:#3b82f6;

        }

        .btn{

            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#3b82f6;
            color:white;
            font-size:15px;
            font-weight:600;
            cursor:pointer;

        }

        .btn:hover{
            background:#2563eb;
        }

        .current{

            background:#f8fafc;
            border-left:4px solid #3b82f6;
            padding:12px;
            margin-bottom:20px;
            border-radius:8px;
            color:#475569;

        }

        .back{

            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#64748b;
            font-size:14px;

        }

        .back:hover{
            color:#0f172a;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Reschedule Booking</h2>

    <div class="current">

        <b>Current Date:</b> {{booking[1]}} <br><br>

        <b>Current Time Slot:</b> {{booking[2]}}

    </div>

    <form method="POST">

        <label>Select New Date</label>

        <input
            type="date"
            name="date"
            required
        >

        <label>Select New Time Slot</label>

        <select name="time_slot" required>

            <option value="">Choose Slot</option>

            <option value="9 AM - 11 AM">
                9 AM - 11 AM
            </option>

            <option value="11 AM - 1 PM">
                11 AM - 1 PM
            </option>

            <option value="2 PM - 4 PM">
                2 PM - 4 PM
            </option>

            <option value="4 PM - 6 PM">
                4 PM - 6 PM
            </option>

        </select>

        <button type="submit" class="btn">
            Update Booking
        </button>

    </form>

    <a href="/my_bookings" class="back">
        ← Back to My Bookings
    </a>

</div>

</body>
</html>
