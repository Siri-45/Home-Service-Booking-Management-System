<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e3a8a);
        }

        .login-box{

            width:500px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);

        }

        .title{

            text-align:center;
            margin-bottom:25px;
            font-weight:700;
            color:#0f172a;

        }

        .form-control{

            padding:12px;
            border-radius:10px;
            margin-bottom:15px;

        }

        .role-section{

            margin-bottom:20px;

        }

        .role-title{

            font-weight:600;
            margin-bottom:10px;
            color:#334155;

        }

        .role-options{

            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:15px;

        }

        .role-card{

            border:2px solid #cbd5e1;
            border-radius:12px;
            padding:15px;
            text-align:center;
            cursor:pointer;
            transition:0.3s;
            background:#f8fafc;

        }

        .role-card:hover{

            border-color:#2563eb;
            transform:translateY(-3px);
            background:#eff6ff;

        }

        .role-card input{

            display:none;

        }

        .selected{

            border-color:#2563eb;
            background:#dbeafe;

        }

        .btn-login{

            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-weight:600;

        }

        .btn-login:hover{

            background:#1d4ed8;

        }

        .bottom-link{

            text-align:center;
            margin-top:18px;

        }

    </style>

</head>

<body>

<div class="login-box">

    <h2 class="title">
        Login
    </h2>

    <form method="POST">

        <div class="role-section">

            <div class="role-title">
                Select Role
            </div>

            <div class="role-options">

                <label class="role-card"
                       onclick="selectRole(this)">

                    <input type="radio"
                           name="role"
                           value="user"
                           required>

                    <div>User</div>

                </label>

                <label class="role-card"
                       onclick="selectRole(this)">

                    <input type="radio"
                           name="role"
                           value="provider">

                    <div>Provider</div>

                </label>

                <label class="role-card"
                       onclick="selectRole(this)">

                    <input type="radio"
                           name="role"
                           value="admin">

                    <div>Admin</div>

                </label>

            </div>

        </div>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               class="form-control"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               class="form-control"
               required>

        <button class="btn-login">
            Login
        </button>

    </form>

    <div class="bottom-link">

        <a href="/register">
            Create New Account
        </a>

    </div>

</div>

<script>

function selectRole(element){

    let cards =
    document.querySelectorAll('.role-card');

    cards.forEach(card => {

        card.classList.remove('selected');

    });

    element.classList.add('selected');

}

</script>

</body>
</html>
