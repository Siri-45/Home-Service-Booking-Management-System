<!DOCTYPE html>
<html>
<head>

    <title>User Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            font-family:'Segoe UI',sans-serif;
            background:#f1f5f9;
        }

        .header{

            background:#0f172a;
            color:white;
            padding:18px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;

        }

        .header h2{
            margin:0;
        }

        .header-right a{

            text-decoration:none;
            padding:10px 16px;
            border-radius:8px;
            color:white;
            margin-left:10px;
            font-weight:500;

        }

        .booking-btn{
            background:#2563eb;
        }

        .logout-btn{
            background:#ef4444;
        }

        .container-box{
            padding:30px;
        }

        .top-bar{

            margin-bottom:30px;

        }

        .top-bar form{

            display:flex;
            gap:15px;
            flex-wrap:wrap;

        }

        .top-bar input,
        .top-bar select{

            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            min-width:220px;

        }

        .top-bar button{

            background:#2563eb;
            color:white;
            border:none;
            padding:12px 18px;
            border-radius:8px;
            cursor:pointer;

        }

        .services-grid{

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:20px;

        }

        .service-card{

            background:white;
            border-radius:16px;
            padding:22px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
            transition:0.3s;

        }

        .service-card:hover{
            transform:translateY(-5px);
        }

        .service-card h3{

            margin-top:0;
            color:#1e293b;
            margin-bottom:15px;

        }

        .price{

            color:#10b981;
            font-size:22px;
            font-weight:bold;
            margin-bottom:15px;

        }

        .book-btn{

            display:inline-block;
            background:#10b981;
            color:white;
            text-decoration:none;
            padding:10px 16px;
            border-radius:8px;
            font-weight:500;

        }

        .empty-box{

            background:white;
            padding:20px;
            border-radius:12px;
            color:#64748b;

        }

    </style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <h2>Available Services</h2>

    <div class="header-right">

        <a href="/my_bookings" class="booking-btn">
            My Bookings
        </a>

        <a href="/logout" class="logout-btn">
            Logout
        </a>

    </div>

</div>

<!-- CONTENT -->

<div class="container-box">

    <!-- SEARCH + SORT -->

    <div class="top-bar">

        <form method="GET" action="/dashboard">

            <input type="text"
                   name="search"
                   placeholder="Search Services">

            <select name="sort">

                <option value="">
                    Sort By
                </option>

                <option value="low">
                    Price Low To High
                </option>

                <option value="high">
                    Price High To Low
                </option>

            </select>

            <button type="submit">
                Search
            </button>

        </form>

    </div>

    <!-- SERVICES -->

    {% if services %}

    <div class="services-grid">

        {% for s in services %}

        <div class="service-card">

            <h3>{{s[1]}}</h3>

            <div class="price">
                ₹{{s[4]}}
            </div>

            <a href="/book/{{s[0]}}" class="book-btn">
                Book Service
            </a>

        </div>

        {% endfor %}

    </div>

    {% else %}

    <div class="empty-box">
        No Services Available
    </div>

    {% endif %}

</div>

</body>
</html>
