<!DOCTYPE html>
<html>
<head>
    <title>Add Service</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #dbe6f6);
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .service-card h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            margin-bottom: 15px;
        }

        button {
            width: 100%;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            text-decoration: none;
            color: #3b82f6;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="service-card">

    <h2>Add Service</h2>

    <form method="POST">

        <input class="form-control" name="name" placeholder="Service Name" required>

        <input class="form-control" type="number" name="price" placeholder="Price (₹)" required>

        <button class="btn btn-success">Add Service</button>

    </form>

    <div class="back-link">
        <a href="/admin">← Back to Admin Panel</a>
    </div>

</div>

</body>
</html>
