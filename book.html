<!DOCTYPE html>
<html>
<head>

    <title>Book Service</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            margin:0;
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px 15px;

            font-family:'Segoe UI',sans-serif;

            background:
            linear-gradient(135deg,#0f172a,#1e3a8a);

        }

        .box{

            width:100%;
            max-width:720px;

            background:white;

            padding:35px;

            border-radius:22px;

            box-shadow:
            0 12px 35px rgba(0,0,0,0.2);

        }

        h2{

            text-align:center;

            margin-bottom:30px;

            font-weight:700;

            color:#0f172a;

        }

        label{

            font-weight:600;

            margin-bottom:8px;

            color:#334155;

        }

        .form-control{

            border-radius:12px;

            padding:12px;

            border:2px solid #cbd5e1;

            transition:0.3s;

        }

        .form-control:focus{

            border-color:#2563eb;

            box-shadow:
            0 0 0 4px rgba(37,99,235,0.15);

        }

        textarea.form-control{

            resize:none;

        }

        .btn-book{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:#2563eb;

            color:white;

            font-size:16px;

            font-weight:600;

            transition:0.3s;

            margin-top:10px;

        }

        .btn-book:hover{

            background:#1d4ed8;

            transform:translateY(-2px);

        }

        .service-badge{

            display:inline-block;

            background:#dbeafe;

            color:#1e40af;

            padding:6px 12px;

            border-radius:20px;

            font-size:13px;

            margin-bottom:20px;

            font-weight:600;

        }

    </style>

</head>

<body>

<div class="box">

    <div class="service-badge">

        Home Service Booking

    </div>

    <h2>

        Book Service

    </h2>

    <form method="POST">

        <!-- DATE -->

        <div class="mb-3">

            <label>

                Service Date

            </label>

            <input
                type="date"
                name="date"
                class="form-control"
                required>

        </div>

        <!-- TIME SLOT -->

        <div class="mb-3">

            <label>

                Time Slot

            </label>

            <select
                name="time_slot"
                class="form-control"
                required>

                <option value="">

                    Select Time Slot

                </option>

                <option>

                    9 AM - 11 AM

                </option>

                <option>

                    11 AM - 1 PM

                </option>

                <option>

                    2 PM - 4 PM

                </option>

                <option>

                    4 PM - 6 PM

                </option>

            </select>

        </div>

        <!-- ADDRESS -->

        <div class="mb-3">

            <label>

                Address

            </label>

            <textarea
                name="address"
                class="form-control"
                rows="3"
                placeholder="Enter service address"
                required></textarea>

        </div>

        <!-- CONTACT -->

        <div class="mb-3">

            <label>

                Contact Number

            </label>

            <input
                type="text"
                name="contact_number"
                class="form-control"
                placeholder="Enter mobile number"
                required>

        </div>

        <!-- DESCRIPTION -->

        <div class="mb-3">

            <label>

                Problem Description

            </label>

            <textarea
                name="description"
                class="form-control"
                rows="4"
                placeholder="Describe the issue..."
                required></textarea>

        </div>

        <!-- SERVICE TYPE -->

        <div class="mb-3">

            <label>

                Service Priority

            </label>

            <select
                name="service_type"
                class="form-control"
                required>

                <option value="Normal">

                    Normal

                </option>

                <option value="Urgent">

                    Urgent

                </option>

            </select>

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="btn-book">

            Confirm Booking

        </button>

    </form>

</div>

</body>
</html>
